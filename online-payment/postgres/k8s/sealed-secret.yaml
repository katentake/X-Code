# 由 mini-k8s-platform/scripts/seal-secrets.sh default 生成，密文可以安全提交到 Git。
# 生成前占位符会导致 sealed-secrets-controller 解密失败——先跑脚本再提交。
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: default
spec:
  encryptedData:
    POSTGRES_USER: REPLACE_WITH_KUBESEAL_OUTPUT
    POSTGRES_PASSWORD: REPLACE_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: postgres-secret
      namespace: default
    type: Opaque
