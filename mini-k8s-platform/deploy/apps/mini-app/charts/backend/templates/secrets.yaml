{{- if .Values.secrets.enabled }}
# 仅本地练手用：secrets.enabled=true 时渲染明文 Secret，替代 sealed-secrets.yaml。
# 生产/GitOps 路径请保持 secrets.enabled=false，见 values.yaml 顶部注释。
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  PAYMENT_API_KEY: {{ .Values.secrets.payment.apiKey | quote }}
{{- end }}
