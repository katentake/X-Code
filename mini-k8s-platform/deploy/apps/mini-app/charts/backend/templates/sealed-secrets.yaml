{{- if not .Values.secrets.enabled }}
# 由 mini-k8s-platform/scripts/seal-secrets.sh production 生成，密文可以安全提交到 Git。
# namespace 写死为 production（对应 mini-k8s-platform/argocd/argo-app.yaml 里的
# destination.namespace）——kubeseal 默认按 namespace+名字加密，换命名空间部署要重新生成。
# 生成前的占位符会导致 sealed-secrets-controller 解密失败，参见
# mini-k8s-platform/docs/sealed-secrets-key-management.md。
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: production
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-secret
      namespace: production
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: payment-secret
  namespace: production
spec:
  encryptedData:
    PAYMENT_API_KEY: 
  template:
    metadata:
      name: payment-secret
      namespace: production
    type: Opaque
{{- end }}
