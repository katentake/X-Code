apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets   # 2026-06 从 bitnami-labs 迁移到 bitnami 组织，旧地址已 404
    chart: sealed-secrets
    targetRevision: 2.19.1          # 部署前建议到 https://github.com/bitnami/sealed-secrets/releases 确认最新版本
    helm:
      releaseName: sealed-secrets
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system          # 控制器本身跑在 kube-system，和它自动生成的私钥 Secret 放在一起
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
